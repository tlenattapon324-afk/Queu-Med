<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="apple-touch-icon" href="/app-icon.png"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>เข้าสู่ระบบ — Queue-Med</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="/vendor/api-token.js"></script>
  <style>
    :root{
      --sky-1:#eef7ff; --sky-2:#d9ecfd; --sky-3:#bfe0fb;
      --ink:#123a5a; --ink-soft:#4f6f8a; --line:#cfe3f5;
      --brand-1:#14c1b0; --brand-2:#0a8fc0; --brand-3:#1546b8;
      --err-bg:#fff1f1; --err-line:#ffc9c9; --err-ink:#c62828;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Kanit','Leelawadee UI','Segoe UI',Tahoma,sans-serif;min-height:100vh;color:var(--ink);
      display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow-x:hidden;
      background:radial-gradient(1200px 600px at 10% -10%,#ffffff 0,transparent 60%),
                 linear-gradient(160deg,var(--sky-1) 0%,var(--sky-2) 45%,var(--sky-3) 100%)}
    /* soft pastel bubbles */
    .bubble{position:fixed;border-radius:50%;filter:blur(2px);opacity:.55;z-index:0;pointer-events:none}
    .b1{width:340px;height:340px;left:-90px;bottom:-110px;background:radial-gradient(circle at 30% 30%,#ffffff,#a7d8f7)}
    .b2{width:220px;height:220px;right:-60px;top:-50px;background:radial-gradient(circle at 30% 30%,#ffffff,#b9e6f0)}
    .b3{width:120px;height:120px;right:12%;bottom:8%;background:radial-gradient(circle at 30% 30%,#ffffff,#c7dcfb)}

    .wrap{position:relative;z-index:1;width:100%;max-width:430px}
    .card{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:40px 36px 30px;
      box-shadow:0 24px 60px rgba(21,70,184,.14),0 2px 8px rgba(21,70,184,.06)}

    .brand{text-align:center;margin-bottom:28px}
    .brand-icon{width:92px;height:92px;border-radius:24px;display:block;margin:0 auto 14px;
      box-shadow:0 14px 30px rgba(10,143,192,.32);animation:float 5s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .brand-name{font-size:2.35rem;font-weight:800;letter-spacing:.5px;line-height:1.1;
      background:linear-gradient(120deg,var(--brand-1),var(--brand-2) 45%,var(--brand-3));
      -webkit-background-clip:text;background-clip:text;color:transparent}
    .brand-sub{font-size:.98rem;font-weight:500;color:var(--ink-soft);margin-top:6px}
    .brand-pill{display:inline-block;margin-top:12px;font-size:.72rem;font-weight:600;letter-spacing:1px;
      color:var(--brand-2);background:#e3f4fd;border:1px solid #c6e6f8;border-radius:999px;padding:3px 12px}

    .field{margin-bottom:16px}
    .field label{display:block;font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:6px}
    .input-wrap{position:relative}
    .input-wrap .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1rem;opacity:.6}
    .field input{width:100%;background:#f6fbff;border:1.5px solid var(--line);border-radius:14px;
      padding:13px 16px 13px 42px;color:var(--ink);font-size:1rem;font-family:inherit;transition:all .2s}
    .field input:focus{outline:none;border-color:var(--brand-2);background:#fff;box-shadow:0 0 0 4px rgba(10,143,192,.12)}
    .field input::placeholder{color:#9db4c8;font-weight:300}

    .btn-login{width:100%;border:none;border-radius:14px;padding:14px;margin-top:6px;cursor:pointer;
      font-family:inherit;font-size:1.05rem;font-weight:600;letter-spacing:.3px;color:#fff;
      background:linear-gradient(120deg,var(--brand-2),var(--brand-3));
      box-shadow:0 10px 22px rgba(21,70,184,.25);transition:transform .15s,box-shadow .15s,opacity .2s}
    .btn-login:hover{transform:translateY(-1px);box-shadow:0 14px 26px rgba(21,70,184,.3)}
    .btn-login:disabled{opacity:.55;cursor:not-allowed;transform:none}

    .err{background:var(--err-bg);border:1px solid var(--err-line);color:var(--err-ink);border-radius:12px;
      padding:10px 14px;font-size:.88rem;margin-top:12px;display:none;line-height:1.5}
    .err.show{display:block}

    .or{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:#8aa6bd;font-size:.8rem;font-weight:500}
    .or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}

    .btn-bms{width:100%;background:#fff;border:1.5px solid #bfe6d2;color:#1f7a4d;border-radius:14px;padding:12px;
      font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s;
      display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-bms:hover{background:#f1fbf5;border-color:#7fd1a7}
    #bmsBox .btn-login{background:linear-gradient(120deg,#2fbf71,#1f8a54);box-shadow:0 10px 22px rgba(31,138,84,.22)}

    .btn-cfg{width:100%;margin-top:18px;background:transparent;border:1.5px dashed #b9d6ee;color:var(--ink-soft);
      border-radius:14px;padding:11px;font-size:.9rem;font-weight:500;cursor:pointer;font-family:inherit;
      transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
    .btn-cfg:hover{border-color:var(--brand-2);border-style:solid;color:var(--brand-2);background:#f3faff}

    .foot{text-align:center;margin-top:18px;font-size:.75rem;color:#7f9bb3}

    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);
      border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:7px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Department selection modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(18,58,90,.25);display:flex;align-items:center;justify-content:center;
      z-index:100;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s;padding:16px}
    .modal-overlay.show{opacity:1;pointer-events:all}
    .modal{background:#fff;border-radius:24px;padding:32px 28px;width:100%;max-width:420px;
      box-shadow:0 24px 60px rgba(21,70,184,.2);transform:translateY(16px);transition:transform .25s}
    .modal-overlay.show .modal{transform:translateY(0)}
    .modal-title{font-size:1.3rem;font-weight:700;color:var(--brand-3);margin-bottom:4px;text-align:center}
    .modal-sub{font-size:.88rem;color:var(--ink-soft);text-align:center;margin-bottom:20px}
    .dept-list{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto}
    .dept-btn{background:#f6fbff;border:1.5px solid var(--line);border-radius:14px;color:var(--ink);
      font-size:1rem;font-family:inherit;font-weight:500;padding:13px 16px;text-align:left;cursor:pointer;
      transition:all .18s;display:flex;align-items:center;gap:10px}
    .dept-btn:hover{border-color:var(--brand-2);background:#eaf6fe}
    .dept-icon{font-size:1.1rem;flex-shrink:0}
    .dept-loading{text-align:center;color:var(--ink-soft);font-size:.92rem;padding:20px 0}
    .dept-err{color:var(--err-ink);font-size:.9rem;text-align:center;padding:10px 0}

    @media (max-width:420px){ .card{padding:32px 22px 24px} .brand-name{font-size:2rem} }
  </style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>

<!-- Department selection modal -->
<div class="modal-overlay" id="deptOverlay">
  <div class="modal">
    <div class="modal-title">เลือกห้องตรวจ</div>
    <div class="modal-sub" id="deptWelcome">กรุณาเลือกห้องตรวจที่ต้องการใช้งาน</div>
    <div class="dept-list" id="deptList">
      <div class="dept-loading">กำลังโหลด...</div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <div class="brand">
      <img class="brand-icon" src="/app-icon.png" alt="Queue-Med"/>
      <div class="brand-name">Queue-Med</div>
      <div class="brand-sub">ระบบบริหารจัดการคิวโรงพยาบาล</div>
      <span class="brand-pill">HOSPITAL QUEUE SYSTEM</span>
    </div>

    <div class="field">
      <label for="username">ชื่อผู้ใช้งาน</label>
      <div class="input-wrap"><span class="ic">👤</span>
        <input type="text" id="username" placeholder="ชื่อผู้ใช้ HOSxP" autocomplete="username"/></div>
    </div>
    <div class="field">
      <label for="password">รหัสผ่าน</label>
      <div class="input-wrap"><span class="ic">🔒</span>
        <input type="password" id="password" placeholder="รหัสผ่าน" autocomplete="current-password"/></div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="err" id="errMsg"></div>

    <div class="or">หรือ</div>
    <div id="bmsToggleWrap">
      <button class="btn-bms" onclick="toggleBmsBox()">🔑 เข้าสู่ระบบด้วย BMS Session</button>
    </div>
    <div id="bmsBox" style="display:none;margin-top:14px">
      <div class="field">
        <label for="bmsSessionId">BMS Session ID</label>
        <div class="input-wrap"><span class="ic">🔑</span>
          <input type="text" id="bmsSessionId" placeholder="วาง Session ID ที่นี่"/></div>
      </div>
      <button class="btn-login" id="bmsLoginBtn" onclick="doBmsLogin()">เข้าสู่ระบบด้วย BMS Session</button>
      <div class="err" id="bmsErrMsg"></div>
    </div>

    <button class="btn-cfg" onclick="location.href='/db-config.html'">⚙️ ตั้งค่าการเชื่อมต่อฐานข้อมูล</button>
  </div>
  <div class="foot">Queue-Med · เชื่อมต่อข้อมูลผู้ใช้งานจาก HOSxP</div>
</div>

<script>
  // Auto-redirect if already logged in
  const _tok = sessionStorage.getItem('authToken');
  if (_tok) {
    fetch('/api/auth/verify', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token: _tok })
    }).then(r => r.json()).then(d => { if (d.success) location.href = '/'; });
  }

  document.getElementById('username').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('password').focus();
  });
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  // ── BMS Session login (ดู BMS-SESSION-SPECIFICATION.md) ────────────────
  // รองรับ 3 ทาง: URL parameter (?bms-session-id=), Cookie (7 วัน), และกรอกเอง
  function getBmsCookie() {
    const m = document.cookie.match(/(?:^|; )bms_session_id=([^;]*)/);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function setBmsCookie(id) {
    const d = new Date(); d.setTime(d.getTime() + 7 * 24 * 60 * 60 * 1000);
    document.cookie = 'bms_session_id=' + encodeURIComponent(id) + '; expires=' + d.toUTCString() + '; path=/';
  }
  function clearBmsCookie() {
    document.cookie = 'bms_session_id=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
  }

  function toggleBmsBox() {
    const box = document.getElementById('bmsBox');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
    if (box.style.display === 'block') document.getElementById('bmsSessionId').focus();
  }

  document.getElementById('bmsSessionId').addEventListener('keydown', e => {
    if (e.key === 'Enter') doBmsLogin();
  });

  function doBmsLogin(sessionIdArg) {
    const sessionId = sessionIdArg || document.getElementById('bmsSessionId').value.trim();
    const btn   = document.getElementById('bmsLoginBtn');
    const errEl = document.getElementById('bmsErrMsg');
    errEl.classList.remove('show');

    if (!sessionId) {
      errEl.textContent = 'กรุณากรอก BMS Session ID';
      errEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>กำลังเข้าสู่ระบบ...';

    fetch('/api/auth/bms-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId })
    })
    .then(r => r.json())
    .then(d => {
      if (d.success) {
        setBmsCookie(sessionId);
        sessionStorage.setItem('authToken', d.token);
        sessionStorage.setItem('officerName', d.officer.name);
        fetchDepts(d.token, d.officer.name);
      } else {
        clearBmsCookie();
        errEl.textContent = d.message;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบด้วย BMS Session';
        document.getElementById('bmsBox').style.display = 'block';
      }
    })
    .catch(() => {
      errEl.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบด้วย BMS Session';
    });
  }

  // ตรวจ URL parameter ก่อน (ล้างออกจาก URL ทันที) จากนั้นค่อยตรวจ Cookie
  (function autoBmsLogin() {
    const params = new URLSearchParams(location.search);
    const urlSid = params.get('bms-session-id');
    if (urlSid) {
      params.delete('bms-session-id');
      const clean = location.pathname + (params.toString() ? '?' + params.toString() : '');
      history.replaceState({}, '', clean);
      toggleBmsBox();
      doBmsLogin(urlSid);
      return;
    }
    const cookSid = getBmsCookie();
    if (cookSid) {
      toggleBmsBox();
      doBmsLogin(cookSid);
    }
  })();

  function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');
    const errEl    = document.getElementById('errMsg');
    errEl.classList.remove('show');

    if (!username || !password) {
      errEl.textContent = 'กรุณากรอกชื่อผู้ใช้งานและรหัสผ่าน';
      errEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>กำลังเข้าสู่ระบบ...';

    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    })
    .then(r => r.json())
    .then(d => {
      if (d.success) {
        sessionStorage.setItem('authToken', d.token);
        sessionStorage.setItem('officerName', d.officer.name);
        fetchDepts(d.token, d.officer.name);
      } else {
        errEl.textContent = d.message;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ';
      }
    })
    .catch(() => {
      errEl.textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'เข้าสู่ระบบ';
    });
  }

  function fetchDepts(token, officerName) {
    const overlay  = document.getElementById('deptOverlay');
    const listEl   = document.getElementById('deptList');
    const welcomeEl = document.getElementById('deptWelcome');
    welcomeEl.textContent = officerName + ' — กรุณาเลือกห้องตรวจ';
    listEl.innerHTML = '<div class="dept-loading">กำลังโหลด...</div>';
    overlay.classList.add('show');

    fetch('/api/officer/departments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(d => {
      if (!d.success) {
        listEl.innerHTML = '<div class="dept-err">' + escHtml(d.message || 'โหลดข้อมูลไม่สำเร็จ') + '</div>';
        return;
      }
      const depts = d.departments || [];
      if (depts.length === 0) {
        listEl.innerHTML = '<div class="dept-err">ไม่พบห้องตรวจที่กำหนด</div>';
        return;
      }
      if (depts.length === 1) {
        selectDept(token, depts[0].depcode, depts[0].name);
        return;
      }
      listEl.innerHTML = '';
      depts.forEach(dept => {
        const btn = document.createElement('button');
        btn.className = 'dept-btn';
        btn.innerHTML = '<span class="dept-icon">🏥</span>' + escHtml(dept.name);
        btn.onclick = () => selectDept(token, dept.depcode, dept.name);
        listEl.appendChild(btn);
      });
    })
    .catch(err => {
      listEl.innerHTML = '<div class="dept-err">เกิดข้อผิดพลาด: ' + escHtml(err.message) + '</div>';
    });
  }

  function selectDept(token, depcode, deptName) {
    const listEl = document.getElementById('deptList');
    listEl.innerHTML = '<div class="dept-loading">กำลังโหลด...</div>';

    fetch('/api/auth/select-dept', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, depcode, deptName })
    })
    .then(r => r.json())
    .then(d => {
      if (d.success) {
        sessionStorage.setItem('currentDepcode', d.depcode);
        sessionStorage.setItem('currentDeptName', d.deptName);
        location.href = '/';
      } else {
        listEl.innerHTML = '<div class="dept-err">' + (d.message || 'เกิดข้อผิดพลาด') + '</div>';
      }
    })
    .catch(() => {
      listEl.innerHTML = '<div class="dept-err">เกิดข้อผิดพลาด กรุณาลองใหม่</div>';
    });
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
<!-- login page keeps its own pastel colours: the shared brightness/saturation panel is not applied here -->
</body>
</html>
